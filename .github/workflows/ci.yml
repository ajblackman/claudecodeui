name: CI

on:
  push:
    branches: [main, security-fixes]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────
  # 1. Lint — ESLint for frontend + Node syntax check for server
  # ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: ESLint (frontend)
        run: npx eslint src/ --max-warnings 0

      - name: Syntax check (server)
        run: |
          for f in $(find server/ -name '*.js' -not -path '*/node_modules/*'); do
            node --check "$f" || exit 1
          done

  # ─────────────────────────────────────────────────────────────────
  # 2. Typecheck — TypeScript compiler in noEmit mode
  # ─────────────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit -p tsconfig.json

  # ─────────────────────────────────────────────────────────────────
  # 3. Build — Verify Vite production build succeeds
  # ─────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

  # ─────────────────────────────────────────────────────────────────
  # 4. Test — Vitest unit + integration tests with coverage
  # ─────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npx vitest run --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────
  # 5. Security — npm audit + custom security checks
  # ─────────────────────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: npm audit (production deps)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Security regression tests
        run: npx vitest run --reporter=verbose tests/security/

      - name: Check for hardcoded secrets
        run: |
          echo "Scanning for hardcoded secrets..."
          # Check for common secret patterns (API keys, passwords, tokens)
          FINDINGS=$(grep -rn \
            -e 'sk-[a-zA-Z0-9]\{20,\}' \
            -e 'ghp_[a-zA-Z0-9]\{36\}' \
            -e 'gho_[a-zA-Z0-9]\{36\}' \
            -e 'password\s*=\s*["\x27][^"\x27]\{8,\}["\x27]' \
            -e 'secret\s*=\s*["\x27][^"\x27]\{8,\}["\x27]' \
            --include='*.js' --include='*.ts' --include='*.tsx' --include='*.jsx' \
            --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git \
            server/ src/ shared/ 2>/dev/null || true)
          
          if [ -n "$FINDINGS" ]; then
            echo "⚠️  Potential hardcoded secrets found:"
            echo "$FINDINGS"
            echo ""
            echo "Review these findings — false positives are possible."
            # Don't fail the build, just warn
          else
            echo "✅ No hardcoded secrets detected"
          fi
